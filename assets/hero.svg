<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Petros Dhespollari - iOS engineer</title>
  <desc id="desc">OLED-black liquid-glass slab with specular top edge, rim light, inner shadow, and drop shadow. iOS engineer profile for high-trust Apple-platform product surfaces.</desc>
  <defs>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="bodyTint" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="specular" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dispR" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) scale(360 240)">
      <stop stop-color="#FF7AA2" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FF7AA2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dispC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1200 280) scale(360 240)">
      <stop stop-color="#7DD3FC" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B8B8BD"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-20%" width="120%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="12" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feComposite in="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="#000000"/>

  <g filter="url(#drop)">
    <rect x="24" y="20" width="1152" height="240" rx="36" fill="#0A0A0B"/>
  </g>
  <rect x="24" y="20" width="1152" height="240" rx="36" fill="url(#bodyTint)"/>
  <rect x="24" y="20" width="1152" height="240" rx="36" fill="url(#dispR)"/>
  <rect x="24" y="20" width="1152" height="240" rx="36" fill="url(#dispC)"/>
  <rect x="24" y="20" width="1152" height="240" rx="36" fill="url(#dome)"/>
  <rect x="24" y="20" width="1152" height="240" rx="36" fill="url(#floor)"/>
  <rect x="24.5" y="20.5" width="1151" height="239" rx="35.5" stroke="url(#rim)"/>
  <path d="M88 21H1112" stroke="url(#specular)" stroke-width="1"/>

  <g transform="translate(76 92)">
    <text x="0" y="0" fill="#8A8A8F" font-family="SFMono-Regular, ui-monospace, Consolas, monospace" font-size="11" letter-spacing="4">PD · iOS ENGINEER</text>
    <text x="0" y="62" fill="url(#ink)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">Petros Dhespollari</text>
    <text x="0" y="100" fill="#C7C7CC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="17" font-weight="400">Building high-trust product surfaces on Apple platforms.</text>
    <text x="0" y="126" fill="#6E6E73" font-family="SFMono-Regular, ui-monospace, Consolas, monospace" font-size="12" letter-spacing="1.5">SWIFT · SWIFTUI · UIKIT · TCA</text>
  </g>

  <g transform="translate(1004 92)">
    <circle cx="64" cy="32" r="56" fill="#FFFFFF" fill-opacity="0.025" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <path d="M14 32A50 50 0 0 1 114 32" stroke="url(#specular)" stroke-width="1" fill="none"/>
    <text x="64" y="44" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="-1">PD</text>
    <circle cx="106" cy="-6" r="3" fill="#FFFFFF"/>
    <circle cx="106" cy="-6" r="6" fill="none" stroke="#FFFFFF" stroke-opacity="0.4">
      <animate attributeName="r" values="4;10;4" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
