<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Petros Dhespollari iOS engineering profile</title>
  <desc id="desc">A compact liquid-glass inspired profile panel for iOS engineering, SwiftUI, UIKit, TCA, reliability, product ownership, and senior iOS roles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.45" stop-color="#081526"/>
      <stop offset="0.72" stop-color="#111827"/>
      <stop offset="1" stop-color="#070A12"/>
    </linearGradient>
    <radialGradient id="aqua" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(324 16) rotate(78) scale(280 760)">
      <stop stop-color="#58A6FF" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#7DD3FC" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glass" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 72) rotate(138) scale(260 420)">
      <stop stop-color="#D2E9FF" stop-opacity="0.45"/>
      <stop offset="0.48" stop-color="#58A6FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="112" y1="54" x2="1088" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A5D6FF"/>
      <stop offset="1" stop-color="#7EE787" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="766" y1="70" x2="1090" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.52" stop-color="#88C8FF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.345 0 0 0 0 0.651 0 0 0 0 1 0 0 0 0.65 0"/>
      <feBlend in2="SourceGraphic" mode="screen"/>
    </filter>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#A5D6FF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="34" fill="url(#aqua)"/>
  <rect width="1200" height="280" rx="34" fill="url(#glass)"/>
  <rect width="1200" height="280" rx="34" fill="url(#grid)"/>
  <rect x="20" y="20" width="1160" height="240" rx="28" stroke="#FFFFFF" stroke-opacity="0.13"/>
  <path d="M112 54H1088" stroke="url(#scan)" stroke-width="2" filter="url(#softGlow)"/>
  <circle cx="212" cy="54" r="4" fill="#79C0FF" filter="url(#softGlow)">
    <animate attributeName="cx" values="212;988;212" dur="7.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="7.5s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(84 86)">
    <text x="0" y="0" fill="#8B949E" font-family="SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="3">PETERDSP / APPLE PLATFORM SYSTEMS</text>
    <text x="0" y="52" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="48" font-weight="750">Petros Dhespollari</text>
    <text x="0" y="92" fill="#A5D6FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="650">iOS Engineer for high-trust product surfaces</text>
    <text x="0" y="126" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Swift · SwiftUI · UIKit · TCA · fintech reliability · product ownership</text>
  </g>

  <g transform="translate(84 226)">
    <rect width="132" height="30" rx="15" fill="url(#chip)" stroke="#58A6FF" stroke-opacity="0.36"/>
    <text x="25" y="20" fill="#F0F6FC" font-family="SFMono-Regular, Consolas, monospace" font-size="12">Senior iOS</text>
    <rect x="146" width="132" height="30" rx="15" fill="url(#chip)" stroke="#58A6FF" stroke-opacity="0.36"/>
    <text x="173" y="20" fill="#F0F6FC" font-family="SFMono-Regular, Consolas, monospace" font-size="12">Platform</text>
    <rect x="292" width="132" height="30" rx="15" fill="url(#chip)" stroke="#58A6FF" stroke-opacity="0.36"/>
    <text x="327" y="20" fill="#F0F6FC" font-family="SFMono-Regular, Consolas, monospace" font-size="12">Product</text>
    <rect x="438" width="132" height="30" rx="15" fill="url(#chip)" stroke="#58A6FF" stroke-opacity="0.36"/>
    <text x="475" y="20" fill="#F0F6FC" font-family="SFMono-Regular, Consolas, monospace" font-size="12">Fintech</text>
  </g>

  <g transform="translate(760 74)" filter="url(#glassShadow)">
    <rect width="344" height="158" rx="26" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <path d="M30 50H314" stroke="#A5D6FF" stroke-opacity="0.42"/>
    <path d="M30 92H314" stroke="#A5D6FF" stroke-opacity="0.16"/>
    <text x="30" y="32" fill="#F0F6FC" font-family="SFMono-Regular, Consolas, monospace" font-size="15">signal.matrix</text>
    <text x="30" y="76" fill="#A5D6FF" font-family="SFMono-Regular, Consolas, monospace" font-size="15">ownership</text>
    <text x="244" y="76" fill="#7EE787" font-family="SFMono-Regular, Consolas, monospace" font-size="15">high</text>
    <text x="30" y="118" fill="#A5D6FF" font-family="SFMono-Regular, Consolas, monospace" font-size="15">architecture</text>
    <text x="244" y="118" fill="#7EE787" font-family="SFMono-Regular, Consolas, monospace" font-size="15">clean</text>
    <circle cx="304" cy="30" r="6" fill="#7EE787" fill-opacity="0.8">
      <animate attributeName="r" values="4;7;4" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
