<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Petros Dhespollari, iOS engineer at Plum Fintech">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161a"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb-purple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-mint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="bigblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <clipPath id="card-clip"><rect x="40" y="40" width="1120" height="260" rx="36" ry="36"/></clipPath>
    <linearGradient id="icon-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="icon-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="icon-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a31"/>
      <stop offset="1" stop-color="#121215"/>
    </linearGradient>
    <linearGradient id="icon-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mono-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="icon-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Solid dark card: keeps everything readable on GitHub light AND dark themes -->
  <rect x="40" y="40" width="1120" height="260" rx="36" ry="36" fill="url(#base)"/>

  <g clip-path="url(#card-clip)">
    <g filter="url(#bigblur)">
      <circle cx="180" cy="120" r="150" fill="url(#orb-purple)">
        <animate attributeName="cx" values="180;280;210;180" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="120;180;110;120" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1000" cy="210" r="170" fill="url(#orb-cyan)">
        <animate attributeName="cx" values="1000;900;1020;1000" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="600" cy="300" r="130" fill="url(#orb-pink)">
        <animate attributeName="cy" values="300;220;300;300" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="760" cy="70" r="110" fill="url(#orb-mint)">
        <animate attributeName="cx" values="760;660;800;760" dur="15s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect x="-360" y="40" width="320" height="260" fill="url(#shine)">
      <animate attributeName="x" from="-360" to="1200" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="40" width="1120" height="1.5" fill="#ffffff" opacity="0.14"/>
  </g>

  <rect x="40" y="40" width="1120" height="260" rx="36" ry="36" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif">
    <text x="84" y="104" font-size="12" font-weight="700" fill="#8b8b93" letter-spacing="3.5">iOS ENGINEER &#183; ATHENS, GREECE</text>
    <text x="84" y="160" font-size="50" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Petros Dhespollari</text>
    <text x="84" y="198" font-size="19" font-weight="500" fill="#c9c9d1">Building fintech at <tspan fill="#ffffff" font-weight="600">Plum</tspan>. Shipping Apple-platform tools on the side.</text>

    <g font-size="12" font-weight="600" fill="#e6e6ea">
      <g transform="translate(84,232)">
        <rect width="78" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="39" y="19.5" text-anchor="middle">SwiftUI</text>
      </g>
      <g transform="translate(170,232)">
        <rect width="54" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="27" y="19.5" text-anchor="middle">TCA</text>
      </g>
      <g transform="translate(232,232)">
        <rect width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="75" y="19.5" text-anchor="middle">Kotlin Multiplatform</text>
      </g>
      <g transform="translate(390,232)">
        <rect width="124" height="30" rx="15" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.35"/>
        <circle cx="17" cy="15" r="4" fill="#34d399">
          <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="29" y="19.5" fill="#a7f3d0">open to talks</text>
      </g>
    </g>
  </g>

  <!-- App icon fan -->
  <g transform="translate(966,172)">
    <animateTransform attributeName="transform" type="translate" values="966,172;966,164;966,172" dur="6s" repeatCount="indefinite"/>
    <g transform="rotate(-14) translate(-110,-40)" filter="url(#icon-shadow)">
      <rect x="-56" y="-56" width="112" height="112" rx="27" fill="url(#icon-purple)"/>
      <rect x="-56" y="-56" width="112" height="112" rx="27" fill="url(#icon-gloss)"/>
    </g>
    <g transform="rotate(12) translate(104,-30)" filter="url(#icon-shadow)">
      <rect x="-56" y="-56" width="112" height="112" rx="27" fill="url(#icon-cyan)"/>
      <rect x="-56" y="-56" width="112" height="112" rx="27" fill="url(#icon-gloss)"/>
    </g>
    <g filter="url(#icon-shadow)">
      <rect x="-68" y="-68" width="136" height="136" rx="32" fill="url(#icon-front)"/>
      <rect x="-67.5" y="-67.5" width="135" height="135" rx="31.5" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
      <rect x="-68" y="-68" width="136" height="136" rx="32" fill="url(#icon-gloss)" opacity="0.5"/>
      <text x="0" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-2" fill="url(#mono-ink)">PD</text>
      <g transform="translate(-21,44)">
        <circle cx="0" cy="0" r="3" fill="#a78bfa"/>
        <circle cx="14" cy="0" r="3" fill="#22d3ee"/>
        <circle cx="28" cy="0" r="3" fill="#f472b6"/>
        <circle cx="42" cy="0" r="3" fill="#34d399"/>
      </g>
    </g>
  </g>
</svg>
