<svg width="1200" height="250" viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Petros Dhespollari iOS engineering profile</title>
  <desc id="desc">A futuristic profile panel for iOS engineering, Swift, SwiftUI, UIKit, TCA, reliability, and product ownership.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.52" stop-color="#0D1524"/>
      <stop offset="1" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="line" x1="96" y1="80" x2="1104" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#A5D6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="820" y1="50" x2="1106" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.345 0 0 0 0 0.651 0 0 0 0 1 0 0 0 0.9 0"/>
      <feBlend in2="SourceGraphic" mode="screen"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#30363D" stroke-opacity="0.32" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="250" fill="url(#bg)"/>

  <path d="M96 80H1104" stroke="url(#line)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="156" cy="80" r="4" fill="#58A6FF" filter="url(#glow)">
    <animate attributeName="cx" values="156;1044;156" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;1;0.25" dur="8s" repeatCount="indefinite"/>
  </circle>

  <text x="88" y="122" fill="#8B949E" font-family="SFMono-Regular, Consolas, monospace" font-size="16" letter-spacing="3">PETERDSP / IOS SYSTEMS</text>
  <text x="88" y="170" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="700">Petros Dhespollari</text>
  <text x="88" y="208" fill="#A5D6FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600">iOS Engineer building high-reliability Apple-platform products</text>

  <g transform="translate(820 52)">
    <rect width="286" height="150" rx="22" fill="url(#card)" stroke="#30363D"/>
    <path d="M28 48H258" stroke="#58A6FF" stroke-opacity="0.5"/>
    <path d="M28 88H258" stroke="#58A6FF" stroke-opacity="0.22"/>
    <text x="28" y="32" fill="#F0F6FC" font-family="SFMono-Regular, Consolas, monospace" font-size="15">signal.matrix</text>
    <text x="28" y="74" fill="#A5D6FF" font-family="SFMono-Regular, Consolas, monospace" font-size="15">ownership</text>
    <text x="196" y="74" fill="#7EE787" font-family="SFMono-Regular, Consolas, monospace" font-size="15">high</text>
    <text x="28" y="114" fill="#A5D6FF" font-family="SFMono-Regular, Consolas, monospace" font-size="15">architecture</text>
    <text x="196" y="114" fill="#7EE787" font-family="SFMono-Regular, Consolas, monospace" font-size="15">clean</text>
  </g>
</svg>
