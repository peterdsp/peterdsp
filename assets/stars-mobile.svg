<svg width="720" height="620" viewBox="0 0 720 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Total GitHub stars across peterdsp's open-source projects</title>
  <desc id="desc">Mobile OLED-black liquid-glass slab summarizing 79 cumulative GitHub stars across 9 projects.</desc>
  <defs>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="bodyTint" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="specular" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dispR" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) scale(230.4 527)">
      <stop stop-color="#FF7AA2" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FF7AA2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dispC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 620) scale(230.4 527)">
      <stop stop-color="#7DD3FC" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B8B8BD"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="barTrack" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-20%" width="120%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feComposite in="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <rect width="720" height="620" fill="#000000"/>

  <g filter="url(#drop)">
    <rect x="20" y="20" width="680" height="580" rx="36" fill="#0A0A0B"/>
  </g>
  <rect x="20" y="20" width="680" height="580" rx="36" fill="url(#bodyTint)"/>
  <rect x="20" y="20" width="680" height="580" rx="36" fill="url(#dispR)"/>
  <rect x="20" y="20" width="680" height="580" rx="36" fill="url(#dispC)"/>
  <rect x="20" y="20" width="680" height="580" rx="36" fill="url(#dome)"/>
  <rect x="20" y="20" width="680" height="580" rx="36" fill="url(#floor)"/>
  <rect x="20.5" y="20.5" width="679" height="579" rx="35.5" stroke="url(#rim)"/>
  <path d="M80 21H640" stroke="url(#specular)" stroke-width="1"/>

  <g transform="translate(56 90)">
    <text x="0" y="0" fill="#8A8A8F" font-family="SFMono-Regular, ui-monospace, Consolas, monospace" font-size="13" letter-spacing="4">STARS · OPEN SOURCE</text>
    <text x="0" y="150" fill="url(#ink)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" font-size="184" font-weight="700" letter-spacing="-6">79</text>
    <text x="0" y="188" fill="#C7C7CC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="20" font-weight="500">cumulative GitHub stars</text>
    <text x="0" y="216" fill="#6E6E73" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="15">across 9 open-source projects</text>
  </g>

  <g transform="translate(56 360)" font-family="SFMono-Regular, ui-monospace, Consolas, monospace">
    <text x="0" y="0" fill="#8A8A8F" font-size="12" letter-spacing="4">TOP PROJECTS</text>
    <line x1="0" y1="14" x2="524" y2="14" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g transform="translate(0 30)">
      <text x="0" y="11" fill="#E5E5EA" font-size="13" font-weight="500">PromptBar</text>
      <rect x="240" y="2" width="260" height="14" rx="7" fill="url(#barTrack)"/>
      <rect x="240.5" y="2.5" width="259" height="13" rx="6.5" stroke="#FFFFFF" stroke-opacity="0.08" fill="none"/>
      <rect x="240" y="2" width="260" height="14" rx="7" fill="url(#barFill)"/>
      <path d="M244 3.5H496" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="0.75"/>
      <text x="524" y="11" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="end">46</text>
      <text x="0" y="49" fill="#E5E5EA" font-size="13" font-weight="500">Magnetio</text>
      <rect x="240" y="40" width="260" height="14" rx="7" fill="url(#barTrack)"/>
      <rect x="240.5" y="40.5" width="259" height="13" rx="6.5" stroke="#FFFFFF" stroke-opacity="0.08" fill="none"/>
      <rect x="240" y="40" width="96" height="14" rx="7" fill="url(#barFill)"/>
      <path d="M244 41.5H332" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="0.75"/>
      <text x="524" y="49" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="end">17</text>
      <text x="0" y="87" fill="#E5E5EA" font-size="13" font-weight="500">Syrmos</text>
      <rect x="240" y="78" width="260" height="14" rx="7" fill="url(#barTrack)"/>
      <rect x="240.5" y="78.5" width="259" height="13" rx="6.5" stroke="#FFFFFF" stroke-opacity="0.08" fill="none"/>
      <rect x="240" y="78" width="28" height="14" rx="7" fill="url(#barFill)"/>
      <path d="M244 79.5H264" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="0.75"/>
      <text x="524" y="87" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="end">5</text>
      <text x="0" y="125" fill="#E5E5EA" font-size="13" font-weight="500">TranquiMind</text>
      <rect x="240" y="116" width="260" height="14" rx="7" fill="url(#barTrack)"/>
      <rect x="240.5" y="116.5" width="259" height="13" rx="6.5" stroke="#FFFFFF" stroke-opacity="0.08" fill="none"/>
      <rect x="240" y="116" width="23" height="14" rx="7" fill="url(#barFill)"/>
      <path d="M244 117.5H259" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="0.75"/>
      <text x="524" y="125" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="end">4</text>
      <text x="0" y="163" fill="#E5E5EA" font-size="13" font-weight="500">conservatio</text>
      <rect x="240" y="154" width="260" height="14" rx="7" fill="url(#barTrack)"/>
      <rect x="240.5" y="154.5" width="259" height="13" rx="6.5" stroke="#FFFFFF" stroke-opacity="0.08" fill="none"/>
      <rect x="240" y="154" width="11" height="14" rx="7" fill="url(#barFill)"/>
      <path d="M244 155.5H247" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="0.75"/>
      <text x="524" y="163" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="end">2</text>
      <text x="0" y="201" fill="#6E6E73" font-size="13">+ 4 more</text>
      <text x="524" y="201" fill="#8E8E93" font-size="13" font-weight="600" text-anchor="end">5</text>
    </g>
  </g>
</svg>
