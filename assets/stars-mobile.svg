<svg width="720" height="660" viewBox="0 0 720 660" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Total GitHub stars across peterdsp's open-source projects</title>
  <desc id="desc">Mobile glass slab summarizing 109 cumulative GitHub stars across 14 projects.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161a"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <radialGradient id="orbP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbK" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B8B8BD"/>
    </linearGradient>
    <linearGradient id="barTrack" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.09"/>
    </linearGradient>
    <filter id="bigblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="106"/>
    </filter>
  </defs>


  <clipPath id="cardClip"><rect x="20" y="20" width="680" height="620" rx="36"/></clipPath>
  <rect x="20" y="20" width="680" height="620" rx="36" fill="url(#base)"/>
  <g clip-path="url(#cardClip)">
    <g filter="url(#bigblur)">
      <circle cx="108.4" cy="230.8" r="341" fill="url(#orbP)">
        <animate attributeName="cx" values="108.4;156;108.4" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="604.8" cy="392" r="372" fill="url(#orbC)">
        <animate attributeName="cy" values="392;268;392" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="360" cy="627.6" r="310" fill="url(#orbK)"/>
      <circle cx="468.8" cy="69.6" r="260.4" fill="url(#orbM)">
        <animate attributeName="cx" values="468.8;414.4;468.8" dur="16s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect x="20" y="20" width="680" height="1.5" fill="#FFFFFF" opacity="0.1"/>
  </g>
  <rect x="20.5" y="20.5" width="679" height="619" rx="35.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"/>

