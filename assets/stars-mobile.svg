    <line x1="0" y1="-2" x2="608" y2="-2" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g transform="translate(0 22)">
    <g transform="translate(0 0)">
      <text x="0" y="14" fill="#E5E5EA" font-size="14" font-weight="500">PromptBar</text>
      <rect x="240" y="3" width="296" height="10" rx="5" fill="url(#barTrack)"/>
      <rect x="240" y="3" width="296" height="10" rx="5" fill="url(#bar)" opacity="0.95"/>
      <text x="560" y="14" fill="#FFFFFF" font-size="14" font-weight="700">46</text>
    </g>
    <g transform="translate(0 38)">
      <text x="0" y="14" fill="#E5E5EA" font-size="14" font-weight="500">Magnetio</text>
      <rect x="240" y="3" width="296" height="10" rx="5" fill="url(#barTrack)"/>
      <rect x="240" y="3" width="109" height="10" rx="5" fill="url(#bar)" opacity="0.87"/>
      <text x="560" y="14" fill="#FFFFFF" font-size="14" font-weight="700">17</text>
    </g>
    <g transform="translate(0 76)">
      <text x="0" y="14" fill="#E5E5EA" font-size="14" font-weight="500">TranquiMind</text>
      <rect x="240" y="3" width="296" height="10" rx="5" fill="url(#barTrack)"/>
      <rect x="240" y="3" width="26" height="10" rx="5" fill="url(#bar)" opacity="0.79"/>
      <text x="560" y="14" fill="#FFFFFF" font-size="14" font-weight="700">4</text>
    </g>
    <g transform="translate(0 114)">
      <text x="0" y="14" fill="#E5E5EA" font-size="14" font-weight="500">Syrmos</text>
