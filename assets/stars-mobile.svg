    <g transform="translate(0 152)">
      <text x="0" y="14" fill="#E5E5EA" font-size="14" font-weight="500">conservatio</text>
      <rect x="240" y="3" width="296" height="10" rx="5" fill="url(#barTrack)"/>
      <rect x="240" y="3" width="13" height="10" rx="5" fill="url(#bar)" opacity="0.63"/>
      <text x="560" y="14" fill="#FFFFFF" font-size="14" font-weight="700">2</text>
    </g>
    <g transform="translate(0 190)">
      <text x="0" y="14" fill="#6E6E73" font-size="13">+ 4 more</text>
      <text x="560" y="14" fill="#8E8E93" font-size="13" font-weight="600">5</text>
