<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Total GitHub stars across peterdsp's open-source projects</title>
  <desc id="desc">Liquid-glass panel summarizing 77 cumulative GitHub stars across 9 projects.</desc>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.5" stop-color="#081526"/>
      <stop offset="1" stop-color="#070A12"/>
    </linearGradient>
    <radialGradient id="saqua" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 40) rotate(72) scale(320 760)">
      <stop stop-color="#58A6FF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#7DD3FC" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sglass" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1020 60) rotate(140) scale(280 460)">
      <stop stop-color="#D2E9FF" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#58A6FF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.55" stop-color="#79C0FF"/>
      <stop offset="1" stop-color="#7EE787"/>
    </linearGradient>
    <linearGradient id="barTrack" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="totalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F0F6FC"/>
      <stop offset="1" stop-color="#A5D6FF"/>
    </linearGradient>
    <pattern id="sgrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#A5D6FF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="sGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.345 0 0 0 0 0.651 0 0 0 0 1 0 0 0 0.5 0"/>
      <feBlend in2="SourceGraphic" mode="screen"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="34" fill="url(#sbg)"/>
  <rect width="1200" height="340" rx="34" fill="url(#saqua)"/>
  <rect width="1200" height="340" rx="34" fill="url(#sglass)"/>
  <rect width="1200" height="340" rx="34" fill="url(#sgrid)"/>
  <rect x="20" y="20" width="1160" height="300" rx="28" stroke="#FFFFFF" stroke-opacity="0.13"/>

  <g transform="translate(72 70)">
    <text x="0" y="0" fill="#8B949E" font-family="SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="3">STARS / OPEN SOURCE</text>
    <text x="0" y="118" fill="url(#totalGrad)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="148" font-weight="800" letter-spacing="-4">77</text>
    <g transform="translate(2 30)" filter="url(#sGlow)" opacity="0.55">
      <path d="M0 0L228 0" stroke="#58A6FF" stroke-width="1.5"/>
    </g>
    <text x="0" y="156" fill="#A5D6FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="600">cumulative GitHub stars</text>
    <text x="0" y="180" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">across 9 shipped open-source projects</text>

    <g transform="translate(0 214)">
      <circle cx="6" cy="6" r="3" fill="#7EE787"/>
      <circle cx="6" cy="6" r="8" fill="none" stroke="#7EE787" stroke-opacity="0.3">
        <animate attributeName="r" values="6;12;6" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.05;0.6" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="22" y="11" fill="#C9D1D9" font-family="SFMono-Regular, Consolas, monospace" font-size="12">live · github.com/peterdsp</text>
    </g>
  </g>

  <g transform="translate(540 64)" font-family="SFMono-Regular, Consolas, monospace">
    <g transform="translate(0 0)">
      <text x="0" y="14" fill="#F0F6FC" font-size="14" font-weight="600">PromptBar</text>
      <rect x="170" y="2" width="460" height="14" rx="7" fill="url(#barTrack)"/>
      <rect x="170" y="2" width="460" height="14" rx="7" fill="url(#bar)" opacity="0.95"/>
      <text x="640" y="14" fill="#7EE787" font-size="13" font-weight="700">46 ★</text>
    </g>
    <g transform="translate(0 36)">
      <text x="0" y="14" fill="#F0F6FC" font-size="14" font-weight="600">Magnetio</text>
      <rect x="170" y="2" width="460" height="14" rx="7" fill="url(#barTrack)"/>
      <rect x="170" y="2" width="170" height="14" rx="7" fill="url(#bar)" opacity="0.91"/>
      <text x="640" y="14" fill="#79C0FF" font-size="13" font-weight="700">17 ★</text>
    </g>
    <g transform="translate(0 72)">
      <text x="0" y="14" fill="#F0F6FC" font-size="14" font-weight="600">TranquiMind</text>
      <rect x="170" y="2" width="460" height="14" rx="7" fill="url(#barTrack)"/>
      <rect x="170" y="2" width="40" height="14" rx="7" fill="url(#bar)" opacity="0.87"/>
      <text x="640" y="14" fill="#A5D6FF" font-size="13" font-weight="700">4 ★</text>
    </g>
    <g transform="translate(0 108)">
      <text x="0" y="14" fill="#F0F6FC" font-size="14" font-weight="600">Syrmos</text>
      <rect x="170" y="2" width="460" height="14" rx="7" fill="url(#barTrack)"/>
      <rect x="170" y="2" width="30" height="14" rx="7" fill="url(#bar)" opacity="0.83"/>
      <text x="640" y="14" fill="#A5D6FF" font-size="13" font-weight="700">3 ★</text>
    </g>
    <g transform="translate(0 144)">
      <text x="0" y="14" fill="#F0F6FC" font-size="14" font-weight="600">conservatio</text>
      <rect x="170" y="2" width="460" height="14" rx="7" fill="url(#barTrack)"/>
      <rect x="170" y="2" width="20" height="14" rx="7" fill="url(#bar)" opacity="0.79"/>
      <text x="640" y="14" fill="#A5D6FF" font-size="13" font-weight="700">2 ★</text>
    </g>
    <g transform="translate(0 180)">
      <text x="0" y="14" fill="#F0F6FC" font-size="14" font-weight="600">greece-prefectures-and-units</text>
      <rect x="170" y="2" width="460" height="14" rx="7" fill="url(#barTrack)"/>
      <rect x="170" y="2" width="20" height="14" rx="7" fill="url(#bar)" opacity="0.75"/>
      <text x="640" y="14" fill="#A5D6FF" font-size="13" font-weight="700">2 ★</text>
    </g>
    <g transform="translate(0 216)">
      <text x="0" y="14" fill="#8B949E" font-size="12">+3 more</text>
      <text x="640" y="14" fill="#8B949E" font-size="12" font-weight="600">3 ★</text>
    </g>
  </g>
</svg>
