      <text x="0" y="71" fill="#E5E5EA" font-size="13" font-weight="500">Syrmos</text>
      <rect x="240" y="62" width="360" height="14" rx="7" fill="url(#barTrack)"/>
      <rect x="240.5" y="62.5" width="359" height="13" rx="6.5" stroke="#FFFFFF" stroke-opacity="0.08" fill="none"/>
      <rect x="240" y="62" width="77" height="14" rx="7" fill="url(#barFill)"/>
      <path d="M244 63.5H313" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="0.75"/>
      <text x="624" y="71" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="end">10</text>
      <text x="0" y="101" fill="#E5E5EA" font-size="13" font-weight="500">TranquiMind</text>
      <rect x="240" y="92" width="360" height="14" rx="7" fill="url(#barTrack)"/>
      <rect x="240.5" y="92.5" width="359" height="13" rx="6.5" stroke="#FFFFFF" stroke-opacity="0.08" fill="none"/>
      <rect x="240" y="92" width="31" height="14" rx="7" fill="url(#barFill)"/>
      <path d="M244 93.5H267" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="0.75"/>
