      <rect x="240" y="152" width="15" height="14" rx="7" fill="url(#barFill)"/>
      <path d="M244 153.5H251" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="0.75"/>
      <text x="624" y="161" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="end">2</text>
      <text x="0" y="191" fill="#6E6E73" font-size="12">+ 4 more</text>
