<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Total GitHub stars across peterdsp's open-source projects</title>
  <desc id="desc">Glass slab summarizing 96 cumulative GitHub stars across 14 projects.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161a"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <radialGradient id="orbP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbK" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B8B8BD"/>
    </linearGradient>
    <linearGradient id="barTrack" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.09"/>
    </linearGradient>
    <filter id="bigblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="51"/>
    </filter>
    <filter id="drop" x="-10%" y="-20%" width="120%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feComposite in="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="#000000"/>

  <clipPath id="cardClip"><rect x="24" y="20" width="1152" height="280" rx="36"/></clipPath>
  <g filter="url(#drop)">
    <rect x="24" y="20" width="1152" height="280" rx="36" fill="url(#base)"/>
  </g>
  <g clip-path="url(#cardClip)">
    <g filter="url(#bigblur)">
      <circle cx="173.76" cy="115.2" r="154" fill="url(#orbP)">
        <animate attributeName="cx" values="173.76;254.4;173.76" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1014.72" cy="188" r="168" fill="url(#orbC)">
        <animate attributeName="cy" values="188;132;188" dur="12s" repeatCount="indefinite"/>
