      <path d="M244 123.5H251" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="0.75"/>
      <text x="624" y="131" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="end">2</text>
      <text x="0" y="161" fill="#E5E5EA" font-size="13" font-weight="500">greece-prefectures-and-un…</text>
