<svg width="720" height="540" viewBox="0 0 720 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Petros Dhespollari mobile profile hero</title>
  <desc id="desc">A mobile-optimized liquid-glass inspired profile panel for iOS engineering, SwiftUI, UIKit, TCA, reliability, and product ownership.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="720" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.48" stop-color="#081526"/>
      <stop offset="1" stop-color="#070A12"/>
    </linearGradient>
    <radialGradient id="aqua" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(176 20) rotate(75) scale(240 520)">
      <stop stop-color="#58A6FF" stop-opacity="0.85"/>
      <stop offset="0.44" stop-color="#7DD3FC" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="72" y1="56" x2="648" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A5D6FF"/>
      <stop offset="1" stop-color="#7EE787" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="72" y1="306" x2="648" y2="486" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#050B14"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="signalLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#7EE787"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.345 0 0 0 0 0.651 0 0 0 0 1 0 0 0 0.55 0"/>
      <feBlend in2="SourceGraphic" mode="screen"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#A5D6FF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="720" height="540" rx="34" fill="url(#bg)"/>
  <rect width="720" height="540" rx="34" fill="url(#aqua)"/>
  <rect width="720" height="540" rx="34" fill="url(#grid)"/>
  <rect x="18" y="18" width="684" height="504" rx="28" stroke="#FFFFFF" stroke-opacity="0.13"/>
  <path d="M72 56H648" stroke="url(#scan)" stroke-width="2" filter="url(#softGlow)"/>
  <circle cx="120" cy="56" r="4" fill="#79C0FF" filter="url(#softGlow)">
    <animate attributeName="cx" values="120;600;120" dur="7.5s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(56 112)">
    <text x="0" y="0" fill="#8B949E" font-family="SFMono-Regular, Consolas, monospace" font-size="17" letter-spacing="3">PETERDSP / IOS</text>
    <text x="0" y="58" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="52" font-weight="750">Petros</text>
    <text x="0" y="112" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="52" font-weight="750">Dhespollari</text>
    <text x="0" y="158" fill="#A5D6FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="650">iOS Engineer for high-trust</text>
    <text x="0" y="192" fill="#A5D6FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="650">Apple-platform products</text>
  </g>

  <g transform="translate(56 346)">
    <rect width="132" height="34" rx="17" fill="url(#chip)" stroke="#58A6FF" stroke-opacity="0.36"/>
    <text x="25" y="23" fill="#F0F6FC" font-family="SFMono-Regular, Consolas, monospace" font-size="13">Senior iOS</text>
    <rect x="148" width="132" height="34" rx="17" fill="url(#chip)" stroke="#58A6FF" stroke-opacity="0.36"/>
    <text x="176" y="23" fill="#F0F6FC" font-family="SFMono-Regular, Consolas, monospace" font-size="13">Platform</text>
    <rect x="296" width="132" height="34" rx="17" fill="url(#chip)" stroke="#58A6FF" stroke-opacity="0.36"/>
    <text x="332" y="23" fill="#F0F6FC" font-family="SFMono-Regular, Consolas, monospace" font-size="13">Product</text>
    <rect x="444" width="132" height="34" rx="17" fill="url(#chip)" stroke="#58A6FF" stroke-opacity="0.36"/>
    <text x="482" y="23" fill="#F0F6FC" font-family="SFMono-Regular, Consolas, monospace" font-size="13">Fintech</text>
  </g>

  <g transform="translate(56 410)">
    <rect width="608" height="86" rx="24" fill="url(#panel)" stroke="#58A6FF" stroke-opacity="0.38"/>
    <path d="M28 44H580" stroke="url(#signalLine)" stroke-width="1.5"/>
    <text x="28" y="29" fill="#F0F6FC" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700">signal.matrix</text>
    <text x="28" y="68" fill="#A5D6FF" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700">ownership</text>
    <text x="226" y="68" fill="#7EE787" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700">high</text>
    <text x="334" y="68" fill="#A5D6FF" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700">architecture</text>
    <text x="542" y="68" fill="#7EE787" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle">clean</text>
  </g>
</svg>
